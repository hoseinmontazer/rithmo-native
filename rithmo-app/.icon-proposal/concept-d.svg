<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF4"/>
      <stop offset="1" stop-color="#F1EDE7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#D8E6DE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D8E6DE" stop-opacity="0"/>
