buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Cafe Bazaar's Poolakey in-app billing SDK is published on JitPack, not
// Maven Central. @cafebazaar/react-native-poolakey's own build.gradle
// declares the dependency but only lists mavenCentral()/google() in its
// repositories block, so without this the app fails to resolve it.
allprojects {
    repositories {
        maven { url 'https://jitpack.io' }
    }
}
